# Builds every release artifact from a tag and attaches them to a DRAFT release,
# which nobody sees until the owner publishes it. Nothing here signs anything:
# the Windows installer and the macOS builds are unsigned, and say so.
#
# The macOS GUI is off unless asked for. It links the objc2 crates, whose own
# LICENSE.md says it is unclear whether those crates, derived from Apple's SDKs,
# may be distributed. That is the owner's decision, so it is an input.
#
# Dispatched on a branch, every platform builds and nothing is drafted, because
# the draft job runs only on a tag. That is how to test this file.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      macos_gui:
        description: Build the macOS GUI (read the objc2 note in HANDOFF.md first)
        type: boolean
        default: false

# Only the job that drafts the release may write; the build jobs run npm and
# build scripts and get a read-only token, which checkout does not keep.
permissions:
  contents: read

# One target directory for both workspaces, so the GUI's bundles land beside the CLI.
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch crates for the notices
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path gui/src-tauri/Cargo.toml
      - name: Installer
        shell: bash
        run: |
          (cd gui && npm ci)
          bash tools/stage-sda-sidecar.sh
          cd gui && node_modules/.bin/tauri build --bundles nsis --config src-tauri/tauri.installer.conf.json
      - name: CLI
        shell: bash
        run: bash tools/package-cli.sh x86_64-pc-windows-msvc dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*.exe
            dist/*.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev file
      - name: Fetch crates for the notices
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path gui/src-tauri/Cargo.toml
      - name: Packages
        run: |
          (cd gui && npm ci)
          bash tools/stage-sda-sidecar.sh
          cd gui && node_modules/.bin/tauri build --bundles deb,appimage --config src-tauri/tauri.installer.conf.json
      - name: CLI
        run: |
          rustup target add x86_64-unknown-linux-musl
          bash tools/package-cli.sh x86_64-unknown-linux-musl dist
      - name: Smoke test
        run: |
          sudo dpkg -i target/release/bundle/deb/*.deb
          sda --version
          sda scan examples/firmware | head -5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            dist/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch crates for the notices
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path gui/src-tauri/Cargo.toml
      - name: CLI, both architectures
        run: |
          bash tools/package-cli.sh aarch64-apple-darwin dist
          bash tools/package-cli.sh x86_64-apple-darwin dist
      - name: Smoke test
        run: |
          tar -xzf dist/sda-*-aarch64-apple-darwin.tar.gz -C "$RUNNER_TEMP"
          for d in "$RUNNER_TEMP"/sda-*-aarch64-apple-darwin; do "$d/sda" --version; done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.macos_gui
        with:
          node-version: 22
      - name: GUI
        if: inputs.macos_gui
        run: |
          (cd gui && npm ci)
          bash tools/stage-sda-sidecar.sh
          cd gui && node_modules/.bin/tauri build --bundles dmg --config src-tauri/tauri.installer.conf.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: |
            dist/*.tar.gz
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test natively in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.5'
          usesh: true
          prepare: pkg install -y rust python3 bash git
          run: |
            ln -sf /usr/local/bin/python3 /usr/local/bin/python
            cargo fetch --locked
            cargo fetch --locked --manifest-path gui/src-tauri/Cargo.toml
            bash tools/package-cli.sh x86_64-unknown-freebsd dist
            tar -xzf dist/sda-*-x86_64-unknown-freebsd.tar.gz -C /tmp
            /tmp/sda-*-x86_64-unknown-freebsd/sda --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freebsd
          path: dist/*.tar.gz

  draft:
    needs: [windows, linux, macos, freebsd]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} + | sed 's# \./.*/# #; s# \./# #' | sort -k2 > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          flags=(--draft)
          case "$tag" in *-*) flags+=(--prerelease) ;; esac
          mapfile -t files < <(find artifacts -type f)
          # The notes are this tag's CHANGELOG section. A tag with no section
          # fails here rather than shipping a release that says nothing.
          section=$(awk -v h="## [${tag#v}]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' src/CHANGELOG.md)
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for ${tag#v}"; exit 1
          fi
          printf '%s\n\nUnsigned. See HANDOFF.md for what this release does not establish.\n' "$section" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${flags[@]}" --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${files[@]}"
