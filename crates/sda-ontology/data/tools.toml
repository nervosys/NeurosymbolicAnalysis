# ============================================================================
# External AI model security tools
# ============================================================================

[[tool]]
id = "ext.modelscan"
name = "ModelScan"
origin = "external"
kind = "static"
languages = ["model-artifact"]
capabilities = ["model-artifact-scan"]
exe = "modelscan"
url = "https://github.com/protectai/modelscan"
cost = "free"
maturity = "stable"
requires_build = false
soundness = "heuristic"
limits = "Scans serialization formats for unsafe operators; says nothing about weights."
detects = ["OWASP-LLM", "CWE"]

[[tool]]
id = "ext.picklescan"
name = "picklescan"
origin = "external"
kind = "static"
languages = ["model-artifact"]
capabilities = ["model-artifact-scan"]
exe = "picklescan"
url = "https://github.com/mmaitre314/picklescan"
cost = "free"
maturity = "stable"
requires_build = false
soundness = "heuristic"
limits = "Pickle opcode denylist; a novel gadget chain can evade it."
detects = ["CWE"]

[[tool]]
id = "ext.garak"
name = "garak"
origin = "external"
kind = "dynamic"
languages = ["model-artifact"]
capabilities = ["model-behavior-probe"]
exe = "garak"
url = "https://github.com/NVIDIA/garak"
cost = "free"
maturity = "stable"
requires_build = false
soundness = "heuristic"
limits = "A large probe corpus, but absence of a hit is still not evidence of safety."
detects = ["OWASP-LLM", "ATLAS"]

[[tool]]
id = "ext.pyrit"
name = "PyRIT"
origin = "external"
kind = "dynamic"
languages = ["model-artifact"]
capabilities = ["model-behavior-probe"]
exe = "pyrit"
url = "https://github.com/Azure/PyRIT"
cost = "free"
maturity = "stable"
requires_build = false
soundness = "heuristic"
limits = "Red-teaming orchestration; results depend entirely on the attack corpus supplied."
detects = ["OWASP-LLM", "ATLAS"]

[[tool]]
id = "ext.verus"
name = "Verus"
origin = "external"
kind = "static"
languages = ["rust"]
capabilities = ["deductive-proof", "formal-verification", "memory-safety", "undefined-behavior"]
exe = "cargo-verus"
url = "https://github.com/verus-lang/verus"
cost = "free"
maturity = "experimental"
requires_build = true
soundness = "complete"
limits = "Proves only the pre/postconditions and invariants you wrote. Unspecified code is unconstrained and verifies vacuously; `assume`, `external_body` and `#[verifier::external]` are trusted, not proved. Covers a subset of Rust and pins an exact rustc, which must be installed alongside. Driven as `cargo verus verify`; the standalone `verus` binary exits 0 even when a proof fails, so nothing about its exit status is a result."
detects = ["CWE"]

[[tool]]
id = "ext.kani"
name = "Kani"
origin = "external"
kind = "static"
languages = ["rust"]
capabilities = ["formal-verification", "memory-safety", "undefined-behavior", "concurrency-safety"]
exe = "cargo-kani"
url = "https://model-checking.github.io/kani/"
cost = "free"
maturity = "stable"
requires_build = true
soundness = "complete"
limits = "Bounded model checking via CBMC: complete only up to the loop unwinding bound, and only for the harnesses you write. No harness means no result, not a clean one."
detects = ["CWE"]

[[tool]]
id = "ext.creusot"
name = "Creusot"
origin = "external"
kind = "static"
languages = ["rust"]
capabilities = ["deductive-proof", "formal-verification"]
exe = "cargo-creusot"
url = "https://github.com/creusot-rs/creusot"
cost = "free"
maturity = "experimental"
requires_build = true
soundness = "complete"
limits = "Translates annotated Rust to Why3 and discharges the obligations there. Proves only what the contracts state, needs Why3 and its provers installed alongside, and unsafe code is outside its model."
detects = []

[[tool]]
id = "ext.marabou"
name = "Marabou"
origin = "external"
kind = "static"
languages = ["model-artifact"]
capabilities = ["neural-property-verification", "formal-verification"]
exe = "Marabou"
url = "https://github.com/NeuralNetworkVerification/Marabou"
cost = "free"
maturity = "stable"
requires_build = false
soundness = "complete"
limits = "Proves a property over one stated input region of one network. The result is local: it says nothing outside that region and nothing about a retrained network. Complete for piecewise-linear (ReLU) feed-forward and convolutional networks at thousands to low tens of thousands of neurons; a non-piecewise-linear activation puts a network outside it. A property nobody wrote is a property nobody checked."
detects = []

[[tool]]
id = "ext.abcrown"
name = "alpha-beta-CROWN"
origin = "external"
kind = "static"
languages = ["model-artifact"]
capabilities = ["neural-property-verification", "formal-verification"]
exe = "abcrown.py"
url = "https://github.com/Verified-Intelligence/alpha-beta-CROWN"
cost = "free"
maturity = "stable"
requires_build = false
soundness = "complete"
limits = "Bound propagation with branch and bound over a stated input region; returns `unknown` when the bound is too loose to decide, which is neither a proof nor a counterexample and must not be read as either. Local robustness only. Reaches convolutional networks of a few million parameters and MLPs about five times smaller; recurrent networks only after unrolling to a fixed horizon. Research forks bound small transformers, but over perturbations of the *embeddings* — which is not a claim about the tokens that map into them — and nothing reaches a language model."
detects = []

[[tool]]
id = "ext.nnenum"
name = "nnenum"
origin = "external"
kind = "static"
languages = ["model-artifact"]
capabilities = ["neural-property-verification", "formal-verification"]
exe = "nnenum.py"
url = "https://github.com/stanleybak/nnenum"
cost = "free"
maturity = "stable"
requires_build = false
soundness = "complete"
limits = "Complete for ReLU feed-forward and convolutional networks: it decides the property rather than bounding it, and returns a concrete counterexample when one exists. That completeness costs scale — thousands to low tens of thousands of neurons — and it needs piecewise-linear activations throughout, so a `tanh` gate or a softmax puts a network outside it entirely."
detects = []
