# The statodynamic analysis tool ontology.
#
# This is the catalogue an agent reads to answer "what should I run to find X?"
# without a human having memorised the landscape. Every entry records what the
# tool *is*, what it can *find*, what it *costs*, and — the part most tool lists
# omit — what it cannot do.
#
# `origin = "native"` entries are this toolkit's own engines and run by default.
# Everything else is an adapter: recognised, described, and runnable, but only
# when the operator opts in.
#
# Fields
#   id            provider id, matching the Analyzer that implements or wraps it
#   name          human name
#   origin        native | external
#   kind          static | dynamic | hybrid
#   languages     c, cpp, rust, python, model-artifact, any
#   capabilities  from sda_core::Capability
#   exe           executable that must be on PATH (external only)
#   url           homepage
#   cost          free | free-tier | commercial
#   maturity      experimental | stable | mature
#   requires_build whether the target must be built first
#   soundness     complete | sound | heuristic | unsound
#                   complete  — no false negatives within its stated scope
#                   sound     — no false positives
#                   heuristic — neither guarantee
#                   unsound   — may miss and may over-report
#   limits        what this tool cannot establish, in one sentence

# ============================================================================
# Native engines — the default providers
# ============================================================================

[[tool]]
id = "sda.static.c"
name = "NERVOSYS native C checker"
origin = "native"
kind = "static"
languages = ["c"]
capabilities = ["style-compliance", "metrics-collection", "program-fact-extraction"]
cost = "free"
maturity = "stable"
requires_build = false
soundness = "heuristic"
limits = "Works from tokens and structure only; guidelines needing type information are routed elsewhere and reported as unchecked."
detects = ["MISRA-C-2023"]

[[tool]]
id = "sda.static.cpp"
name = "NERVOSYS native C++ checker"
origin = "native"
kind = "static"
languages = ["cpp"]
capabilities = ["style-compliance", "metrics-collection", "program-fact-extraction"]
cost = "free"
maturity = "experimental"
requires_build = false
soundness = "heuristic"
limits = "The MISRA C++:2023 catalogue is partial; guidelines absent from it are not checked at all, and unconfirmed rule numbers are cited by clause."
detects = ["MISRA-CPP-2023"]

[[tool]]
id = "sda.static.rust"
name = "NERVOSYS native Rust checker"
origin = "native"
kind = "static"
languages = ["rust"]
capabilities = ["style-compliance", "memory-safety", "model-artifact-scan"]
cost = "free"
maturity = "stable"
requires_build = false
soundness = "heuristic"
limits = "Covers the discipline around Rust's escape hatches, not the lints clippy already provides."
detects = ["RUST-2024"]

[[tool]]
id = "sda.dynamic"
name = "NERVOSYS native dynamic engine"
origin = "native"
kind = "dynamic"
languages = ["c", "cpp", "rust"]
capabilities = ["memory-safety", "undefined-behavior", "concurrency-safety", "coverage-measurement", "performance-profiling"]
cost = "free"
maturity = "stable"
requires_build = true
soundness = "sound"
limits = "Only reports what actually executed; says nothing about paths no run reached."

[[tool]]
id = "sda.fuzz"
name = "NERVOSYS native fuzzer"
origin = "native"
kind = "dynamic"
languages = ["c", "cpp", "rust"]
capabilities = ["fuzzing", "coverage-measurement", "memory-safety", "undefined-behavior"]
cost = "free"
maturity = "experimental"
requires_build = true
soundness = "sound"
limits = "Executes a process per input, so throughput is tens of runs per second rather than thousands; it substitutes comparison feedback for brute force, and still finds only what it reaches. On hosted Linux, AFL++ is far faster; this exists for targets AFL cannot instrument."
detects = ["CWE"]

[[tool]]
id = "sda.ai.artifact"
name = "NERVOSYS model artifact scanner"
origin = "native"
kind = "static"
languages = ["model-artifact"]
capabilities = ["model-artifact-scan", "dependency-audit"]
cost = "free"
maturity = "stable"
requires_build = false
soundness = "heuristic"
limits = "Reads containers, not weights; no header inspection can reveal a backdoor in the parameters."
detects = ["OWASP-LLM", "ATLAS", "NIST-AI-RMF"]

[[tool]]
id = "sda.ai.probe"
name = "NERVOSYS model probe runner"
origin = "native"
kind = "dynamic"
languages = ["model-artifact"]
capabilities = ["model-behavior-probe"]
cost = "free"
maturity = "experimental"
requires_build = false
soundness = "heuristic"
limits = "A probe that fires proves a behaviour; a probe that does not fire proves nothing, because the trigger space is unbounded."
detects = ["OWASP-LLM", "ATLAS"]

[[tool]]
id = "sda.correlate"
name = "NERVOSYS statodynamic correlation engine"
origin = "native"
kind = "hybrid"
languages = ["c", "cpp", "rust"]
capabilities = ["program-fact-extraction", "coverage-measurement"]
cost = "free"
maturity = "stable"
requires_build = true
soundness = "sound"
limits = "Adjudicates between static and dynamic evidence; it produces no findings of its own."

