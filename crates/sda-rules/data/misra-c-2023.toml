o = "advisory"
d = "decidable"
s = "single"
# `partial`, not `native`: the guideline is open-ended -- every pair of
# operators of differing precedence is in scope -- and the engine checks three
# traps (`&&` with `||`, a shift with `+`/`-`, an unparenthesized `sizeof`
# operand). A clean 12.1 result is not evidence of conformance, and saying
# `native` claimed that it was.
c = "partial"

