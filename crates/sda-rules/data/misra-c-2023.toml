d = "undecidable"
s = "single"
c = "partial"

[[rule]]
n = "D4.3"
o = "required"
d = "decidable"
s = "single"
# `partial`, not `native`: "encapsulated and isolated" is a judgement, and the
# engine stands in for it with a threshold -- assembly in a function of more
# than two statements. `__asm__ volatile ("nop"); g();` is two, so it passes.
# A clean D4.3 result is not evidence of conformance.
c = "partial"

[[rule]]
n = "D4.4"
o = "advisory"
d = "undecidable"
s = "single"
# `partial`, not `native`: the guideline is undecidable — telling commented-out
# code from prose that mentions code is a judgement, and the engine makes it with
# a heuristic. A clean D4.4 result is not a proof, which is what `native` claims.
c = "partial"

[[rule]]
n = "D4.5"
o = "advisory"
d = "decidable"
s = "system"
# `partial`, not `native`: the guideline is judged across the whole program, and
# the comparison is made within one file's identifier list. `lookup1` in one file
# and `l00kup1` in another are not compared. Demonstrated by
# `system_scope_needs_the_whole_program.rs`.
c = "partial"

[[rule]]
n = "D4.6"
o = "advisory"
d = "decidable"
s = "single"
c = "native"

[[rule]]
