# MISRA C:2023 rule and directive catalogue: identifiers and classification only.
#
# The text of each guideline is copyright MISRA, and this file carries no title,
# because nobody has compared a paraphrase with the licensed document. Anyone who
# holds it can supply titles through `sda rules import`.
#
# Fields
#   n  guideline number ("15.5", "D4.12")
#   o  obligation: mandatory | required | advisory
#   d  decidability: decidable | undecidable
#   s  scope: single | system     (single translation unit vs whole program)
#   c  native coverage: native | partial | semantics | dynamic | external | manual
#        native    — the native engine checks this fully
#        partial   — checked with known gaps, confidence reduced accordingly
#        semantics — needs type/flow information; routed to a compiler via sda-build
#        dynamic   — best established by the dynamic engine at runtime
#        external  — delegated to an external adapter when enabled
#        manual    — a process obligation, not mechanically checkable
#   cwe optional CWE cross-reference

standard = "MISRA C:2023"
language = "c"
# Reconciled against: MISRA C:2012 with Amendments 1-4 and TC1-TC2, as
# consolidated in MISRA C:2023. Run `sda rules audit` to compare this catalogue
# against an authoritative list you supply with `sda rules import`.

