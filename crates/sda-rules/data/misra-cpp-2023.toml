# MISRA C++:2023 catalogue.
#
# COMPLETENESS: PARTIAL, AND DELIBERATELY SO.
#
# MISRA C++:2023 renumbered every guideline against the C++ standard's own
# clause structure, superseding both MISRA C++:2008 and AUTOSAR C++14. Unlike
# the C:2023 numbering — which is stable, widely published, and carried forward
# from C:2012 — the C++:2023 numbering is not something this toolkit will
# reproduce from memory, because a *wrong* rule number in a compliance report is
# worse than a missing one: it corrupts the audit trail.
#
# So this catalogue ships two things:
#
#   1. The clause index below, which is the document's real organising
#      structure. Native C++ checks that have no confirmed rule number cite
#      their clause, so a reviewer can find the governing guideline.
#   2. Individual rules, each carrying `confirmed`. Only `confirmed = true`
#      entries are cited by rule number in a compliance report.
#
# To get a complete, citable catalogue, license the document and run:
#     sda rules import --standard misra-cpp-2023 <file.csv|file.toml>
# which merges an authoritative list over this one. `sda rules audit` reports
# what is still missing.

standard = "MISRA C++:2023"
language = "cpp"
completeness = "partial"

# --- Clause index (the document's organising structure) --------------------
